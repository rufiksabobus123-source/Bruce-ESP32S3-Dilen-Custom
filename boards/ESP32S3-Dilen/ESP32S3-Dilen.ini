; Bruce 1.15 custom target for Dilen's ESP32-S3-N16R8 build.

[env:esp32s3-dilen]
board = esp32s3-dilen
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${env.build_src_filter} +<../boards/ESP32S3-Dilen>
build_flags =
	${env.build_flags}
	-Iboards/ESP32S3-Dilen
	-Os
	-DCORE_DEBUG_LEVEL=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DUSE_HSPI_PORT=1
	-DREDRAW_DELAY=1
	-DDEVICE_NAME='"Dilen ESP32-S3"'

lib_deps =
	${env.lib_deps}
